<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent Conferences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2b2433;
    --muted: #6d6476;
    --line: #e7e0ea;
    --accent: #8e2c74;
    --accent-soft: #f6e8f1;
    --taken: #f0edf2;
    --taken-ink: #a49cab;
    --ok: #2f7a4f;
    --ok-soft: #e7f4ec;
    --err: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Nunito Sans", system-ui, sans-serif; font-size: 16px; line-height: 1.45;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: 30px; line-height: 1.15; margin: 0 0 8px; color: var(--accent);
  }
  .intro { color: var(--muted); margin: 0 0 22px; }
  .notice {
    background: var(--accent-soft); border-radius: 12px; padding: 12px 14px;
    font-size: 14px; margin-bottom: 22px;
  }
  .notice p { margin: 0; }
  .notice p + p { margin-top: 6px; }
  .day { margin-bottom: 26px; }
  .day h2 {
    font-family: "Fraunces", Georgia, serif; font-weight: 500;
    font-size: 20px; margin: 0 0 10px;
  }
  .count { font-family: "Nunito Sans", sans-serif; font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 6px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 440px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .slot {
    font: inherit; font-weight: 700; text-align: left;
    padding: 12px 12px; border-radius: 12px; cursor: pointer;
    border: 1.5px solid var(--accent); background: var(--card); color: var(--accent);
    min-height: 56px; display: flex; flex-direction: column; justify-content: center;
  }
  .slot small { font-weight: 600; font-size: 12px; color: var(--muted); }
  .slot:hover, .slot:focus-visible { background: var(--accent-soft); outline: none; }
  .slot[disabled] { border-color: var(--line); background: var(--taken); color: var(--taken-ink); cursor: default; }
  .slot[disabled] small { color: var(--taken-ink); }
  .status { text-align: center; color: var(--muted); padding: 30px 0; }
  .banner {
    border-radius: 12px; padding: 14px; margin-bottom: 22px; font-weight: 600;
    background: var(--ok-soft); color: var(--ok); display: none;
  }
  /* Sign-up sheet */
  .backdrop {
    position: fixed; inset: 0; background: rgba(43, 36, 51, .45);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .backdrop.open { display: flex; }
  @media (min-width: 600px) { .backdrop { align-items: center; } }
  .sheet {
    background: var(--card); width: 100%; max-width: 480px;
    border-radius: 18px 18px 0 0; padding: 22px 18px 26px;
    max-height: 92vh; overflow-y: auto;
  }
  @media (min-width: 600px) { .sheet { border-radius: 18px; } }
  .sheet h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 22px; margin: 0 0 4px; }
  .sheet .when { color: var(--accent); font-weight: 700; margin: 0 0 16px; }
  label { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .error { color: var(--err); font-size: 14px; font-weight: 600; margin-top: 14px; min-height: 1em; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1; font: inherit; font-weight: 700; padding: 13px; border-radius: 12px; cursor: pointer;
    border: 1.5px solid var(--accent);
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.secondary { background: #fff; color: var(--accent); }
  .btn[disabled] { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>Parent Conferences</h1>
  <p class="intro">Tap an open time to sign up for a 30-minute conference.</p>

  <div class="notice">
    <p><strong>Every part of the sign-up is mandatory.</strong></p>
    <p>Note that a phone number will be called through Signal.</p>
  </div>

  <div class="banner" id="banner" role="status"></div>
  <div id="schedule"><p class="status">Loading times…</p></div>
</main>

<div class="backdrop" id="backdrop">
  <form class="sheet" id="form" novalidate>
    <h3>Sign up</h3>
    <p class="when" id="when"></p>

    <label for="child">Child's name</label>
    <input id="child" name="child" autocomplete="off" required>

    <label for="parent">Parent's name</label>
    <input id="parent" name="parent" autocomplete="name" required>

    <label for="contact">Contact (email or phone #)</label>
    <input id="contact" name="contact" autocomplete="email" required>
    <p class="hint">A phone number will be called through Signal.</p>

    <p class="error" id="error" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn secondary" id="cancel">Cancel</button>
      <button type="submit" class="btn primary" id="save">Sign up</button>
    </div>
  </form>
</div>

<script>
// Paste the Google "Web app URL" between the quotes.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4Ee8jBOLSNmrLCM3lbUEabJUAR_s20r3R791UgQKF3ptOfPEvFfpTCfUwN2eqI0jd/exec";

const PREVIEW_SLOTS = ["8:00 AM","8:30 AM","9:00 AM","9:30 AM","10:00 AM","10:30 AM","11:00 AM","11:30 AM",
  "12:00 PM","12:30 PM","1:00 PM","1:30 PM","2:00 PM","2:30 PM","3:00 PM","3:30 PM"]
  .map(function (t) { return { date: "Friday, 11/20/26", time: t, taken: false }; });

// Lindsey's families get .../conferences/?group=lindsey (only her times show).
const GROUP = (new URLSearchParams(location.search).get("group") || "").trim().toLowerCase();

let slots = [];
let chosen = null;

const $ = function (id) { return document.getElementById(id); };

function render() {
  const box = $("schedule");
  if (!slots.length) { box.innerHTML = '<p class="status">No times are open right now.</p>'; return; }
  const days = [];
  const byDay = {};
  slots.forEach(function (s) {
    if (!byDay[s.date]) { byDay[s.date] = []; days.push(s.date); }
    byDay[s.date].push(s);
  });
  box.innerHTML = "";
  days.forEach(function (d) {
    const sec = document.createElement("section");
    sec.className = "day";
    const open = byDay[d].filter(function (s) { return !s.taken; }).length;
    const h = document.createElement("h2");
    h.textContent = d;
    const c = document.createElement("span");
    c.className = "count";
    c.textContent = open + " open";
    h.appendChild(c);
    sec.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "grid";
    byDay[d].forEach(function (s) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "slot";
      b.disabled = s.taken;
      b.innerHTML = "<span></span><small></small>";
      b.firstChild.textContent = s.time;
      b.lastChild.textContent = s.taken ? "Taken" : "Open";
      if (!s.taken) b.addEventListener("click", function () { openForm(s); });
      grid.appendChild(b);
    });
    sec.appendChild(grid);
    box.appendChild(sec);
  });
}

function load() {
  if (!SCRIPT_URL) { slots = PREVIEW_SLOTS; render(); return; }
  fetch(SCRIPT_URL + (GROUP ? "?group=" + encodeURIComponent(GROUP) : ""))
    .then(function (r) { return r.json(); })
    .then(function (data) { slots = data.slots || []; render(); })
    .catch(function () {
      $("schedule").innerHTML = '<p class="status">Times couldn\'t load. Please refresh the page.</p>';
    });
}

function openForm(s) {
  chosen = s;
  $("when").textContent = s.date + " at " + s.time;
  $("error").textContent = "";
  $("backdrop").classList.add("open");
  setTimeout(function () { $("child").focus(); }, 50);
}

function closeForm() { $("backdrop").classList.remove("open"); chosen = null; }

$("cancel").addEventListener("click", closeForm);
$("backdrop").addEventListener("click", function (e) { if (e.target === this) closeForm(); });

$("form").addEventListener("submit", function (e) {
  e.preventDefault();
  const child = $("child").value.trim();
  const parent = $("parent").value.trim();
  const contact = $("contact").value.trim();
  if (!child || !parent || !contact) { $("error").textContent = "Please fill out every part."; return; }
  const digits = contact.replace(/\D/g, "").length;
  if (contact.indexOf("@") === -1 && digits < 10) {
    $("error").textContent = "Please enter an email address or a phone number.";
    return;
  }
  if (!SCRIPT_URL) { $("error").textContent = "Preview only: sign-ups aren't connected yet."; return; }

  const s = chosen;
  $("save").disabled = true;
  $("save").textContent = "Saving…";
  fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ date: s.date, time: s.time, child: child, parent: parent, contact: contact, group: GROUP })
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.slots) { slots = data.slots; render(); }
      if (!data.ok) { $("error").textContent = data.error || "Something went wrong. Please try again."; return; }
      closeForm();
      $("form").reset();
      const b = $("banner");
      b.textContent = "You're signed up for " + s.date + " at " + s.time + ".";
      b.style.display = "block";
      b.scrollIntoView({ behavior: "smooth", block: "center" });
    })
    .catch(function () { $("error").textContent = "Something went wrong. Please try again."; })
    .finally(function () { $("save").disabled = false; $("save").textContent = "Sign up"; });
});

load();
</script>
</body>
</html>
